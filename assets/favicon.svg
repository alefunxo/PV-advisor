<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Folded tool mark">
  <rect width="32" height="32" rx="7" fill="#0e1a20"/>
  <!-- blade folded out of the body: thin wedge tapering to a sharp point -->
  <path d="M8.4 21.4 19 3.6 12.7 21.4z" fill="#c6d3d9"/>
  <!-- the body: slimmer handle so it doesn't read as a hull -->
  <rect x="4" y="19.6" width="24" height="7.2" rx="3.6" fill="#b0342c"/>
  <!-- pivot rivet -->
  <circle cx="8.4" cy="23.2" r="1" fill="#0e1a20" fill-opacity="0.38"/>
  <!-- cross -->
  <rect x="19.7" y="22.5" width="4.6" height="1.4" fill="#ffffff"/>
  <rect x="21.3" y="20.9" width="1.4" height="4.6" fill="#ffffff"/>
</svg>
